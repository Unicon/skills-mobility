# Local multi-service dev/demo environment: the Phase-1 spine + LearnCard delivery.
#
# One shared Python image (docker/Dockerfile.python), run once per service via
# `command` (binding 0.0.0.0); the Node issuer adapter has its own image
# (docker/Dockerfile.node). Services reach each other by compose service name.
# Run:  docker compose up --build
#
# LearnCard secrets (LEARNCARD_API_TOKEN, SECURE_SEED, …) come from the demo
# provisioning step (tools/learncard-demo, ADR-0020) via a gitignored root .env
# — see .env.example and docker/README.md. Without them the stack still comes up,
# but the LearnCard adapters/resolver report unconfigured.
name: skills-mobility

x-python: &python
  build:
    context: .
    dockerfile: docker/Dockerfile.python
  image: skills-mobility-python:local
  restart: unless-stopped

services:
  mock-lms:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('mock_lms.app:create_app', factory=True, host='0.0.0.0', port=8000)"]
    environment:
      MOCK_LMS_EVENT_CONSUMER_URL: http://event-consumer:8200
    ports: ["8000:8000"]
    # No depends_on event-consumer: mock-lms only calls it at *trigger* time (the
    # async emit), not at startup, and gating it here would close a startup cycle
    # (context-builder -> mock-lms -> event-consumer -> orchestrator ->
    # context-builder). The synchronous read path (context-builder -> mock-lms) is
    # the one gated instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  event-consumer:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('event_consumer.app:create_app', factory=True, host='0.0.0.0', port=8200)"]
    environment:
      EVENT_CONSUMER_ORCHESTRATOR_URL: http://orchestrator:8400
      EVENT_CONSUMER_DB_PATH: /data/event-consumer.db
    volumes: ["event-consumer-data:/data"]
    ports: ["8200:8200"]
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8200/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  context-builder:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('context_builder.app:create_app', factory=True, host='0.0.0.0', port=8100)"]
    environment:
      CONTEXT_BUILDER_LMS_BASE_URL: http://mock-lms:8000
    ports: ["8100:8100"]
    depends_on:
      mock-lms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8100/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Field Mapping LLM Decision Service (live Bedrock). The orchestrator now calls it
  # at the mapping steps (best-effort — obv3 still delivers). Also smoke-testable
  # directly via POST :8120/map. AWS creds are short-lived (aws configure
  # export-credentials into the gitignored .env); startup is AWS-free (lazy client).
  field-mapping:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('field_mapping.api:create_app', factory=True, host='0.0.0.0', port=8120)"]
    environment:
      FIELD_MAPPING_MODE: bedrock
      FIELD_MAPPING_MODEL_ID: ${FIELD_MAPPING_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      FIELD_MAPPING_AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports: ["8120:8120"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8120/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Delivery Targets LLM Decision Service (live Bedrock; #77). The orchestrator calls
  # it at target selection (best-effort — deterministic fixed targets otherwise). Also
  # smoke-testable via POST :8130/select-delivery-targets. Startup is AWS-free (lazy client).
  delivery-targets:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('delivery_targets.api:create_app', factory=True, host='0.0.0.0', port=8130)"]
    environment:
      DELIVERY_TARGETS_MODE: bedrock
      DELIVERY_TARGETS_MODEL_ID: ${DELIVERY_TARGETS_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      DELIVERY_TARGETS_AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports: ["8130:8130"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8130/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Workflow Actions LLM Decision Service (live Bedrock; #78). The orchestrator calls it
  # for the pre-target gate and the delivery-phase plan (best-effort — deterministic
  # gate/plan otherwise). Smoke-testable via POST :8140/pre-target-gate and
  # :8140/delivery-phase-plan. Startup is AWS-free (lazy client).
  workflow-actions:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('workflow_actions.api:create_app', factory=True, host='0.0.0.0', port=8140)"]
    environment:
      WORKFLOW_ACTIONS_MODE: bedrock
      WORKFLOW_ACTIONS_MODEL_ID: ${WORKFLOW_ACTIONS_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      WORKFLOW_ACTIONS_AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports: ["8140:8140"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8140/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Field Synthesis LLM Decision Service (live Bedrock; #85). Generates human-facing
  # text for credential fields Field Mapping marks for synthesis. Smoke-testable via
  # POST :8150/synthesize-fields. Not yet wired into the orchestrator (the synthesis
  # seam is still the {"synthesized": {}} stub — that wiring is a follow-up).
  field-synthesis:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('field_synthesis.api:create_app', factory=True, host='0.0.0.0', port=8150)"]
    environment:
      FIELD_SYNTHESIS_MODE: bedrock
      FIELD_SYNTHESIS_MODEL_ID: ${FIELD_SYNTHESIS_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      FIELD_SYNTHESIS_AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports: ["8150:8150"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8150/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('orchestrator.app:create_app', factory=True, host='0.0.0.0', port=8400)"]
    environment:
      ORCHESTRATOR_CONTEXT_BUILDER_URL: http://context-builder:8100
      ORCHESTRATOR_PROFILE_RESOLVER_URL: http://profile-resolver:8700
      ORCHESTRATOR_DELIVERY_ROUTER_URL: http://delivery-router:8800
      # Field Mapping is called at the mapping steps (best-effort; #27 item 8).
      ORCHESTRATOR_FIELD_MAPPING_URL: http://field-mapping:8120
      # LLM Decision Service planner seams (best-effort; #77/#78).
      ORCHESTRATOR_DELIVERY_TARGETS_URL: http://delivery-targets:8130
      ORCHESTRATOR_WORKFLOW_ACTIONS_URL: http://workflow-actions:8140
      # The signed OBv3's issuer must be the real (resolvable) demo issuer DID, not
      # the placeholder default — else the issuer adapter's SDK sign fails resolving it.
      ORCHESTRATOR_ISSUER_ID: ${LEARNCARD_ISSUER_DID:-did:web:poc.skills-mobility.example}
      LEARNCARD_DEMO_RECIPIENT_PROFILE_ID: ${LEARNCARD_DEMO_RECIPIENT_PROFILE_ID:-smi-demo-learner}
      ORCHESTRATOR_DB_PATH: /data/orchestrator.db
    volumes: ["orchestrator-data:/data"]
    ports: ["8400:8400"]
    depends_on:
      context-builder:
        condition: service_healthy
      profile-resolver:
        condition: service_healthy
      delivery-router:
        condition: service_healthy
      field-mapping:
        condition: service_healthy
      delivery-targets:
        condition: service_healthy
      workflow-actions:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8400/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- LearnCard delivery layer (ADR-0016/0020) ---

  profile-resolver:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('learncard_profile_resolver.app:create_app', factory=True, host='0.0.0.0', port=8700)"]
    environment:
      LEARNCARD_PROFILE_RESOLVER_DB_PATH: /data/learncard-profile-resolver.db
      LEARNCARD_API_URL: ${LEARNCARD_API_URL:-https://network.learncard.com/api}
      LEARNCARD_API_TOKEN: ${LEARNCARD_API_TOKEN:-}
    volumes: ["profile-resolver-data:/data"]
    ports: ["8700:8700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8700/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  delivery-router:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('delivery_router.app:create_app', factory=True, host='0.0.0.0', port=8800)"]
    environment:
      DELIVERY_ROUTER_LEARNCARD_ISSUER_URL: http://learncard-issuer-adapter:8910
      DELIVERY_ROUTER_LEARNCARD_WALLET_URL: http://learncard-wallet-adapter:8900
      DELIVERY_ROUTER_SMARTRESUME_URL: http://smartresume-adapter:8920
    ports: ["8800:8800"]
    depends_on:
      learncard-issuer-adapter:
        condition: service_healthy
      learncard-wallet-adapter:
        condition: service_healthy
      smartresume-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8800/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  learncard-issuer-adapter:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    image: skills-mobility-node:local
    restart: unless-stopped
    environment:
      PORT: "8910"
      LOG_LEVEL: info
      # The demo issuer identity is the *organization* profile tools/learncard-demo
      # provisions (smi-demo-organization, #54/ADR-0020) — not a separate "issuer".
      # The adapter derives its signing seed from SEED_LABEL (#48 option b) — nothing
      # to copy by hand; SECURE_SEED overrides it only for a standalone throwaway id.
      SEED_LABEL: ${SEED_LABEL:-organization}
      SECURE_SEED: ${SECURE_SEED:-}
      PROFILE_ID: ${LEARNCARD_ISSUER_PROFILE_ID:-smi-demo-organization}
      PROFILE_NAME: ${LEARNCARD_ISSUER_PROFILE_NAME:-SMI Demo Organization}
    ports: ["8910:8910"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8910/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  learncard-wallet-adapter:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('learncard_wallet_adapter.app:create_app', factory=True, host='0.0.0.0', port=8900)"]
    environment:
      LEARNCARD_API_URL: ${LEARNCARD_API_URL:-https://network.learncard.com/api}
      LEARNCARD_API_TOKEN: ${LEARNCARD_API_TOKEN:-}
      # Recipient-scoped read token for the delivered-credential read-back (#53/#55).
      LEARNCARD_RECIPIENT_API_TOKEN: ${LEARNCARD_RECIPIENT_API_TOKEN:-}
    ports: ["8900:8900"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8900/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- SmartResume delivery (#87) ---

  # Deterministic stand-in for the real SmartResume CredentialConnect API so the demo
  # runs offline. Implements /api/v1/token + /api/v1/credentials.
  mock-smartresume:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('mock_smartresume.app:create_app', factory=True, host='0.0.0.0', port=8930)"]
    ports: ["8930:8930"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8930/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # SmartResume delivery adapter — behind the Delivery Router (deliver_to_smartresume).
  # Points at the mock in the demo; set SMARTRESUME_ADAPTER_API_URL + real creds for
  # staging/prod. Smoke-testable via the router or POST :8920/internal/deliver-to-smartresume.
  smartresume-adapter:
    <<: *python
    command: ["uv", "run", "python", "-c", "import logging,uvicorn; logging.basicConfig(level='INFO'); uvicorn.run('smartresume_adapter.app:create_app', factory=True, host='0.0.0.0', port=8920)"]
    environment:
      SMARTRESUME_ADAPTER_API_URL: ${SMARTRESUME_ADAPTER_API_URL:-http://mock-smartresume:8930}
      SMARTRESUME_ADAPTER_CLIENT_ID: ${SMARTRESUME_ADAPTER_CLIENT_ID:-demo-client}
      SMARTRESUME_ADAPTER_ACCESS_KEY: ${SMARTRESUME_ADAPTER_ACCESS_KEY:-demo-key}
    ports: ["8920:8920"]
    depends_on:
      mock-smartresume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8920/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  event-consumer-data:
  orchestrator-data:
  profile-resolver-data:
