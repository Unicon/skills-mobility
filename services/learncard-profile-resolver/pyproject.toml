[project]
name = "learncard-profile-resolver"
version = "0.1.0"
description = "LearnCard Profile Resolver — resolve a learner identifier to a LearnCard profile (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "learncard-api",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Installed only in the container-image Lambda build; keeps local/compose lean.
lambda = ["mangum>=0.19"]

[project.scripts]
learncard-profile-resolver = "learncard_profile_resolver.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learncard_profile_resolver"]
