[project]
name = "transformation-executor"
version = "0.1.0"
description = "Transformation Executor — deterministic JSONata expression runner that applies LLM-produced field mappings to assembled source payloads (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jsonata-python>=0.5",
    "jsonschema>=4.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
transformation-executor = "transformation_executor.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformation_executor"]
