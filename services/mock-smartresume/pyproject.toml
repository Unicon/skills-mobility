[project]
name = "mock-smartresume"
version = "0.1.0"
description = "Mock SmartResume — deterministic offline stand-in for the SmartResume CredentialConnect API (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
mock-smartresume = "mock_smartresume.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_smartresume"]
