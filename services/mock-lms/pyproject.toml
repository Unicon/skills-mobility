[project]
name = "mock-lms"
version = "0.1.0"
description = "Mock Event Producer / Mock LMS — Canvas-style metadata APIs + event emission for the Skills Mobility POC"
requires-python = ">=3.12"
dependencies = [
    "skills-mobility-events",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
mock-lms = "mock_lms.app:run"
# Authoring tool: generate + capture fixtures. Requires the dev dependency group (Faker).
mock-lms-generate = "mock_lms.generators.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_lms"]
