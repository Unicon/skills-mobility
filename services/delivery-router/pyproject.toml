[project]
name = "delivery-router"
version = "0.1.0"
description = "Delivery Router — thin facade that dispatches approved delivery actions to target adapters (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
delivery-router = "delivery_router.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_router"]
