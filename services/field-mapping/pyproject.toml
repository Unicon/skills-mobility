[project]
name = "field-mapping"
version = "0.1.0"
description = "Field Mapping LLM Decision Service — generates JSONata transformation mappings (Skills Mobility POC)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_mapping"]
