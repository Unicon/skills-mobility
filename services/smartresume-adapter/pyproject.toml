[project]
name = "smartresume-adapter"
version = "0.1.0"
description = "SmartResume Adapter — delivers an achievement or credential to the SmartResume CredentialConnect API (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Installed only in the container-image Lambda build; keeps local/compose lean.
lambda = ["mangum>=0.19"]

[project.scripts]
smartresume-adapter = "smartresume_adapter.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartresume_adapter"]
