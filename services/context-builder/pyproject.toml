[project]
name = "context-builder"
version = "0.1.0"
description = "Context Builder — deterministic source-data aggregation for the Orchestrator (Skills Mobility POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed only in the container-image Lambda build; keeps local/compose lean.
lambda = ["mangum>=0.19"]

[project.scripts]
context-builder = "context_builder.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_builder"]
