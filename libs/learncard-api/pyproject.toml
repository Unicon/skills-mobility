[project]
name = "learncard-api"
version = "0.1.0"
description = "Shared LearnCloud Network API client (base URL + scoped bearer) for the Skills Mobility POC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learncard_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/learncard_api/py.typed" = "learncard_api/py.typed"
