[project]
name = "skills-mobility-events"
version = "0.1.0"
description = "Shared event contracts (envelope + event bodies) for the Skills Mobility POC"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_mobility_events"]
