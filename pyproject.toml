[project]
name = "skills-mobility"
version = "0.0.0"
description = "Skills Mobility Infrastructure POC — workspace root"
requires-python = ">=3.12"
dependencies = []

# Virtual workspace root: not itself a package, just the anchor for members below.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]
# The LearnCard issuer adapter is a Node/TS service, not a Python uv member.
exclude = ["services/learncard-issuer-adapter"]

[tool.uv.sources]
skills-mobility-events = { workspace = true }
mock-lms = { workspace = true }
learncard-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7",
    "faker>=30",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
# importlib mode so same-named test modules across packages (e.g. several
# services' test_app.py / test_engine.py) don't collide on collection.
addopts = "-ra --import-mode=importlib"
testpaths = ["libs", "services"]
