AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Skills Mobility — Foundation stack.
  Provisions shared primitives (EventBridge bus, SQS work queue + DLQ,
  DynamoDB execution-state table, GitHub Actions OIDC role) and exports
  their names/ARNs for service stacks to import.

Parameters:
  ProjectName:
    Type: String
    Default: skills-mobility
    Description: Prefix applied to all resource names and export keys.

  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment tier.

  GitHubOrg:
    Type: String
    Description: GitHub organisation that owns the repository (for OIDC trust).

  GitHubRepo:
    Type: String
    Description: GitHub repository name (without the org prefix).

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if the GitHub Actions OIDC provider already exists in this
      AWS account (an account can have only one instance of
      token.actions.githubusercontent.com).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:

  # ---------------------------------------------------------------------------
  # EventBridge custom bus
  # ---------------------------------------------------------------------------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}"

  # ---------------------------------------------------------------------------
  # SQS — orchestrator work queue + dead-letter queue
  # ---------------------------------------------------------------------------
  OrchestratorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvName}-orchestrator-dlq"
      MessageRetentionPeriod: 1209600  # 14 days

  OrchestratorQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvName}-orchestrator"
      VisibilityTimeout: 120  # must be >= Lambda timeout for the worker
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrchestratorDLQ.Arn
        maxReceiveCount: 3

  # ---------------------------------------------------------------------------
  # DynamoDB — execution state
  # ---------------------------------------------------------------------------
  ExecutionStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvName}-execution-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: execution_id
          AttributeType: S
      KeySchema:
        - AttributeName: execution_id
          KeyType: HASH

  # ---------------------------------------------------------------------------
  # GitHub Actions OIDC
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Thumbprint list — GitHub's current leaf CA thumbprint.
      # AWS now validates the OIDC provider against the CA bundle automatically,
      # but the list is still required by the resource type.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # IAM role assumed by GitHub Actions via OIDC.
  # Trusted subject matches any branch/PR in the configured repo; tighten to
  # specific branches (e.g. ref:refs/heads/main) for production use.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
      Policies:
        - PolicyName: deploy-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation — deploy stacks in this project
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${EnvName}*"
              # ECR — authenticate, create repos, push images
              - Sid: ECR
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ECRRepos
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/*"
              # Lambda — update function code after image push
              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:PublishVersion
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource:
                  !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${EnvName}*"
              # IAM — pass roles to Lambda (scoped to project roles)
              - Sid: IAMPassRole
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvName}*"
              # IAM — create/update the per-service Lambda execution roles
              - Sid: IAMRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:TagRole
                Resource:
                  !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvName}*"
              # S3 — read templates from the template bucket
              - Sid: S3Templates
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${EnvName}-cfn-templates"
                  - !Sub "arn:aws:s3:::${ProjectName}-${EnvName}-cfn-templates/*"

Outputs:
  EventBusName:
    Value: !Ref EventBus
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-event-bus-name"

  EventBusArn:
    Value: !GetAtt EventBus.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-event-bus-arn"

  OrchestratorQueueUrl:
    Value: !Ref OrchestratorQueue
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-orchestrator-queue-url"

  OrchestratorQueueArn:
    Value: !GetAtt OrchestratorQueue.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-orchestrator-queue-arn"

  OrchestratorDLQArn:
    Value: !GetAtt OrchestratorDLQ.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-orchestrator-dlq-arn"

  ExecutionStateTableName:
    Value: !Ref ExecutionStateTable
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-table-name"

  ExecutionStateTableArn:
    Value: !GetAtt ExecutionStateTable.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-table-arn"

  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Export:
      Name: !Sub "${ProjectName}-${EnvName}-deploy-role-arn"
