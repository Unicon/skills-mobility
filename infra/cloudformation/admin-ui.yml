AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Skills Mobility — Admin UI static hosting (CloudFront + private S3, IAM-free).
  Two origins so the SPA's relative /executions calls work unchanged (packages/contracts
  api.ts uses same-origin relative paths, no base-URL hook): the default behavior serves
  the SPA from the private UI bucket via Origin Access Control; /executions* and /healthz
  are routed to the Orchestrator Function URL. No IAM roles created (deployer is
  PowerUserAccess) — S3 read is granted to CloudFront via a bucket policy, not a role.

Parameters:
  ProjectName:
    Type: String
    Default: skills-mobility
  EnvName:
    Type: String
    Default: dev
  UiBucketName:
    Type: String
    Description: Existing admin-ui bucket (from foundation-demo.yml export).
  OrchestratorDomain:
    Type: String
    Description: >
      Orchestrator Function URL host only, no scheme/path — e.g.
      abc123.lambda-url.us-east-1.on.aws

Resources:
  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${EnvName}-admin-ui-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${EnvName} admin UI"
        DefaultRootObject: index.html
        Origins:
          - Id: s3-spa
            DomainName: !Sub "${UiBucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: orchestrator
            DomainName: !Ref OrchestratorDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-spa
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /executions*
            TargetOriginId: orchestrator
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            # AWS managed CachingDisabled + AllViewerExceptHostHeader
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /healthz
            TargetOriginId: orchestrator
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          # SPA routing: send 403/404 to index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # Let this distribution read the private bucket (OAC).
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UiBucketName}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
    Description: CloudFront domain for the Admin UI.
  DistributionId:
    Value: !Ref Distribution
    Description: Use for cache invalidations after re-uploading the SPA.
